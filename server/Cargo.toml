[package]
name = "server"
version = "0.1.0"
edition = "2021"

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
shared_engine = { path = "../shared/engine" }
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
rand = "0.8"
jsonwebtoken = "9"
# axum-core's FromRequestParts is itself `#[async_trait]`-desugared (MSRV
# reasons) — impls must use the same macro or the trait/impl signatures
# won't unify (E0195). Version pinned to what's already in Cargo.lock via
# axum's own dependency, so this adds no new transitive dependency tree.
async-trait = "0.1"
# Postgres persistence (DECISIONS.md D-021 — replaces Firestore). Plain
# runtime queries (tokio-postgres), no compile-time-checked-query macros and
# no ORM: smaller, faster-compiling dependency tree, and matches this repo's
# existing style of hand-rolled REST/SQL calls over heavy SDKs.
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14"
argon2 = "0.5"
