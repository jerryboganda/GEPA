name: CI Pipeline (Compute Offload)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full Verification Suite (Offloaded)
    runs-on: ubuntu-latest

    # Postgres (DECISIONS.md D-021 — no Firebase/Firestore/Java emulator
    # needed). This is the only place DB-dependent code is actually
    # exercised against a live database — never locally on a dev machine.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gepa
          POSTGRES_PASSWORD: gepa
          POSTGRES_DB: gepa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://gepa:gepa@localhost:5432/gepa
      JWT_SECRET: ci-test-secret-not-for-prod

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@v2

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Seed Bank Invariant Validation
        run: npm run seed:validate

      - name: Form Assembly & Conflict Check
        run: npm run forms:check

      - name: Audio QC & Asset Verification
        run: npm run audio:produce

      - name: Item Exposure & Telemetry Audit
        run: npm run report:exposure

      - name: Workspace Typecheck (Cargo + TypeScript)
        run: npm run typecheck

      - name: Linting (Clippy + Claims Copy Linter)
        run: npm run lint

      - name: Cargo Test Suite (Engine + Postgres-backed Server Tests)
        run: npm run test

      - name: Client Production Build (Astro)
        run: npm run build:client

      - name: Bundle Secrets Scan (M12 — server-only material must not ship)
        run: python scripts/scan_bundle_secrets.py

      - name: Initial Payload Size Gate (M12 — < 400 kB gzipped)
        run: python scripts/check_bundle_size.py

      - name: Install Playwright Browsers
        run: npm --prefix client run test:e2e:install

      - name: E2E Journey + Accessibility Suite
        run: npm run test:e2e
        env:
          E2E_MODE: "true"

  container-build:
    name: Cloud Run Container Build & Smoke Test
    needs: verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gepa
          POSTGRES_PASSWORD: gepa
          POSTGRES_DB: gepa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Container Image (with GHA Cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: gepa-runtime:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container Healthz Smoke Test
        run: |
          docker run -d -p 8080:8080 --name gepa-test \
            --add-host=host.docker.internal:host-gateway \
            -e DATABASE_URL=postgres://gepa:gepa@host.docker.internal:5432/gepa \
            -e JWT_SECRET=ci-test-secret-not-for-prod \
            gepa-runtime:latest
          sleep 5
          curl --fail --retry 5 --retry-connrefused http://localhost:8080/healthz || (docker logs gepa-test && exit 1)
          docker stop gepa-test

      # M12 "log redaction test": boot the same image with canary secret
      # values and a WRONG database password, so the pool-error and
      # migration-failure paths (the only places that could embed the DSN
      # or credentials in an error Display) actually execute, then prove
      # none of the canaries appear in the process's full log output —
      # which includes this crate's tracing events, tower_http's
      # TraceLayer and deadpool's internal tracing.
      - name: Log Redaction Runtime Test (M12)
        run: |
          CANARY_JWT="canary-jwt-secret-DO-NOT-LOG-9f8e7d6c"
          CANARY_GEMINI="canary-gemini-key-DO-NOT-LOG-5a4b3c2d"
          CANARY_DSN="postgres://gepa:canary-db-password-DO-NOT-LOG-1a2b3c4d@host.docker.internal:5432/gepa"
          docker run -d --name gepa-redact-test \
            --add-host=host.docker.internal:host-gateway \
            -e JWT_SECRET="$CANARY_JWT" \
            -e GEMINI_API_KEY="$CANARY_GEMINI" \
            -e DATABASE_URL="$CANARY_DSN" \
            gepa-runtime:latest
          sleep 8
          echo "--- redaction-test container logs (full) ---"
          docker logs gepa-redact-test
          echo "--- scanning captured output for canaries ---"
          LOGS=$(docker logs gepa-redact-test 2>&1)
          STATUS=0
          echo "$LOGS" | grep -qF "$CANARY_JWT"   && { echo "LEAK: JWT_SECRET canary in logs"; STATUS=1; }
          echo "$LOGS" | grep -qF "$CANARY_GEMINI" && { echo "LEAK: GEMINI_API_KEY canary in logs"; STATUS=1; }
          echo "$LOGS" | grep -qF "$CANARY_DSN"   && { echo "LEAK: DATABASE_URL canary in logs"; STATUS=1; }
          echo "$LOGS" | grep -qiF "canary-db-password" && { echo "LEAK: DB password fragment in logs"; STATUS=1; }
          docker stop gepa-redact-test
          if [ $STATUS -ne 0 ]; then exit 1; fi
          echo "log redaction runtime test: CLEAN"
