name: CI Pipeline (Compute Offload)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full Verification Suite (Offloaded)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@v2

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Seed Bank Invariant Validation
        run: npm run seed:validate

      - name: Form Assembly & Conflict Check
        run: npm run forms:check

      - name: Audio QC & Asset Verification
        run: npm run audio:produce

      - name: Item Exposure & Telemetry Audit
        run: npm run report:exposure

      - name: Workspace Typecheck (Cargo + TypeScript)
        run: npm run typecheck

      - name: Linting (Clippy + Claims Copy Linter)
        run: npm run lint

      - name: Cargo Test Suite (Pure Engine Coverage >=95%)
        run: npm run test

      - name: Client Production Build (Astro)
        run: npm run build:client

  container-build:
    name: Cloud Run Container Build & Smoke Test
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image (with GHA Cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: gepa-runtime:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container Healthz Smoke Test
        run: |
          docker run -d -p 8080:8080 --name gepa-test gepa-runtime:latest
          sleep 5
          curl --fail --retry 5 --retry-connrefused http://localhost:8080/healthz || (docker logs gepa-test && exit 1)
          docker stop gepa-test
