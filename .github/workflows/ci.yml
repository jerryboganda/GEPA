name: CI Pipeline (Compute Offload)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full Verification Suite (Offloaded)
    runs-on: ubuntu-latest

    # Postgres (DECISIONS.md D-021 — no Firebase/Firestore/Java emulator
    # needed). This is the only place DB-dependent code is actually
    # exercised against a live database — never locally on a dev machine.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gepa
          POSTGRES_PASSWORD: gepa
          POSTGRES_DB: gepa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://gepa:gepa@localhost:5432/gepa
      JWT_SECRET: ci-test-secret-not-for-prod

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@v2

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Seed Bank Invariant Validation
        run: npm run seed:validate

      - name: Form Assembly & Conflict Check
        run: npm run forms:check

      - name: Audio QC & Asset Verification
        run: npm run audio:produce

      - name: Item Exposure & Telemetry Audit
        run: npm run report:exposure

      - name: Workspace Typecheck (Cargo + TypeScript)
        run: npm run typecheck

      - name: Linting (Clippy + Claims Copy Linter)
        run: npm run lint

      - name: Cargo Test Suite (Engine + Postgres-backed Server Tests)
        run: npm run test

      - name: Client Production Build (Astro)
        run: npm run build:client

      - name: Install Playwright Browsers
        run: npm --prefix client run test:e2e:install

      - name: E2E Journey + Accessibility Suite
        run: npm run test:e2e
        env:
          E2E_MODE: "true"

  container-build:
    name: Cloud Run Container Build & Smoke Test
    needs: verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gepa
          POSTGRES_PASSWORD: gepa
          POSTGRES_DB: gepa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image (with GHA Cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: gepa-runtime:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container Healthz Smoke Test
        run: |
          docker run -d -p 8080:8080 --name gepa-test \
            --add-host=host.docker.internal:host-gateway \
            -e DATABASE_URL=postgres://gepa:gepa@host.docker.internal:5432/gepa \
            -e JWT_SECRET=ci-test-secret-not-for-prod \
            gepa-runtime:latest
          sleep 5
          curl --fail --retry 5 --retry-connrefused http://localhost:8080/healthz || (docker logs gepa-test && exit 1)
          docker stop gepa-test
